<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS EC2 Store</title>

<link rel="ad>

<body>

<nav>
    <div class="logo">🛒 EC2 Store</div>

    <input type="text" id="search"
    placeholder="Search products">

    <div>
        🛍 Cart:
        <span id="cartCount">0</span>

        <button onclick="toggleTheme()">
            🌙
        </button>
    </div>
</nav>

<header class="hero">

    <h1>Modern E-Commerce Store</h1>

    <p>
        Hosted on AWS EC2 + Nginx + GitHub
    </p>

</header>

<section class="stats">

    <div class="stat">
        <h2>500+</h2>
        <p>Products</p>
    </div>

    <div class="stat">
        <h2>1000+</h2>
        <p>Customers</p>
    </div>

    <div class="stat">
        <h2>24x7</h2>
        <p>Support</p>
    </div>

</section>

<section class="category">

    <button onclick="filterProducts('All')">
        All
    </button>

    <button onclick="filterProducts('Electronics')">
        Electronics
    </button>

    <button onclick="filterProducts('Accessories')">
        Accessories
    </button>

</section>

<section id="products" class="products">
</section>

<section class="contact">

<h2>Contact Us</h2>

<p>Email: support@ec2store.com</p>

<p>Hosted from AWS Cloud Infrastructure</p>

</section>

<footer>
🚀 Copyright © AWS EC2 Store
</footer>

<script src="app.js"></script>

</body>
</html>
